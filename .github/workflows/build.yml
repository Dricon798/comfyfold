name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ComfyFold-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ComfyFold-apk
          path: ComfyFold-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" ComfyFold-*.apk
          --title "ComfyFold build ${{ github.run_number }}"
          --notes "Automatic build of ${{ github.sha }}. Download the APK on the phone and open it to install."
